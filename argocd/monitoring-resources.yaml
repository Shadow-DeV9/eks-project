apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-resources
  namespace: argocd

spec:
  project: default
  source:
    repoURL: https://github.com/Shadow-DeV9/eks-project
    targetRevision: main
    path: ./monitoring-resources

  destination:
    namespace: monitoring
    server: https://kubernetes.default.svc

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
