apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kubespace
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - shoshin.org.uk
      secretName: kubespace-tls
  rules:
    - host: shoshin.org.uk
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kubespace-service
                port:
                  number: 80
