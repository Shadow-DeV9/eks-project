apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kubespace-ingress
spec:
  ingressClassName: nginx
  rules:
  - host: eks.shoshin.org.uk
    http:
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: kubespace-service
              port:
                number: 80
