name: Docker Security and EKS Deployment

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  # Terraform security scan
  checkov:
    name: Terraform Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Checkov
        run: |
          python -m pip install --upgrade pip
          pip install checkov

      - name: Scan Terraform infrastructure
        run: checkov -d terraform --framework terraform --soft-fail

      - name: Scan Terraform addons
        run: checkov -d terraform-addons --framework terraform --soft-fail

  # Docker build and push
  docker:
    name: Docker Build and Push
    runs-on: ubuntu-latest
    needs: checkov

    outputs:
      ecr-registry: ${{ steps.ecr-login.outputs.registry }}

    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: eu-north-1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::343918153740:role/github-actions-eks-oidc-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: senbonzakura-ecr
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REPOSITORY:$IMAGE_TAG ./app
          docker tag $ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

  # Trivy scan
  trivy:
    name: Trivy Scan
    runs-on: ubuntu-latest
    needs: docker

    env:
      AWS_REGION: eu-north-1
      ECR_REPOSITORY: senbonzakura-ecr
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}/role/github-actions-eks-oidc-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Scan Docker image with Trivy
        env:
          ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.eu-north-1.amazonaws.com
        run: |
          trivy image --exit-code 0 $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

  # Deploy to EKS
  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: [docker, trivy]

    env:
      AWS_REGION: eu-north-1
      ECR_REPOSITORY: senbonzakura-ecr
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::343918153740:role/github-actions-eks-oidc-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.36.0

      - name: Connect to EKS cluster
        run: |
          aws eks update-kubeconfig --region $AWS_REGION --name eks-cluster

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f ./k8s/

      - name: Update Kubernetes deployment with new Docker image
        env:
          ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.eu-north-1.amazonaws.com
        run: |
          kubectl set image deployment/kubespace kubespace=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Check deployment rollout
        run: |
          kubectl rollout status deployment/kubespace --timeout=180s
