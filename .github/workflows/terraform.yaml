name: Terraform EKS Deployment

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-north-1
  TERRAFORM_VERSION: 1.10.5

# Prevent multiple Terraform deployments running simultaneously
concurrency:
  group: eks-terraform-deployment
  cancel-in-progress: false

jobs:
  # Job 1: Deploy AWS infrastructure

  terraform:
    name: Terraform Infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      TF_VAR_admin_principal_arn: ${{ secrets.EKS_ADMIN_PRINCIPAL_ARN }}

    defaults:
      run:
        working-directory: ./terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      # Temporarily inspect the GitHub OIDC token claims
      - name: Debug GitHub OIDC claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const claims = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );

            core.info(JSON.stringify({
              issuer: claims.iss,
              audience: claims.aud,
              subject: claims.sub,
              repository: claims.repository,
              ref: claims.ref,
              environment: claims.environment
            }, null, 2));

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::343918153740:role/github-actions-eks-oidc-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform apply tfplan

  # Job 2: Deploy Kubernetes addons

  terraform-addons:
    name: Terraform Addons
    runs-on: ubuntu-latest
    needs: terraform
    timeout-minutes: 60

    defaults:
      run:
        working-directory: ./terraform-addons

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::343918153740:role/github-actions-eks-oidc-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform apply tfplan

  # Job 3: Bootstrap ArgoCD
  argocd-bootstrap:
    name: argocd
    runs-on: ubuntu-latest
    needs: terraform-addons
    timeout-minutes: 15

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::343918153740:role/github-actions-eks-oidc-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.36.0"

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name eks-cluster

      # Argo CD config

      - name: Wait for ArgoCD Application CRD
        run: |
          kubectl wait \
            --for=condition=Established \
            --timeout=120s \
            crd/applications.argoproj.io

      - name: Debug ArgoCD Application
        run: |
          echo "Current commit:"
          git rev-parse HEAD
          echo "Application manifest:"
          cat -n argocd/application.yaml

      - name: Apply ArgoCD Monitoring Resources
        run: kubectl apply -f argocd/monitoring-resources.yaml

      - name: Wait for Monitoring Resources
        run: |
          kubectl wait \
            --for=jsonpath='{.status.sync.status}'=Synced \
            application/monitoring-resources \
            -n argocd \
            --timeout=300s

          kubectl wait \
            --for=jsonpath='{.status.health.status}'=Healthy \
            application/monitoring-resources \
            -n argocd \
            --timeout=300s

      - name: Apply ArgoCD Monitoring
        run: kubectl apply -f argocd/monitoring.yaml

      - name: Wait for Monitoring
        run: |
          kubectl wait \
            --for=jsonpath='{.status.sync.status}'=Synced \
            application/monitoring \
            -n argocd \
            --timeout=600s

          kubectl wait \
            --for=jsonpath='{.status.health.status}'=Healthy \
            application/monitoring \
            -n argocd \
            --timeout=600s

      - name: Wait for ServiceMonitor CRD
        run: |
          kubectl wait \
            --for=condition=Established \
            --timeout=120s \
            crd/servicemonitors.monitoring.coreos.com

      - name: Apply ArgoCD Monitoring ServiceMonitor
        run: kubectl apply -f argocd/monitoring-servicemonitor.yaml

      - name: Wait for Monitoring ServiceMonitor
        run: |
          kubectl wait \
            --for=jsonpath='{.status.sync.status}'=Synced \
            application/monitoring-servicemonitor \
            -n argocd \
            --timeout=300s

          kubectl wait \
            --for=jsonpath='{.status.health.status}'=Healthy \
            application/monitoring-servicemonitor \
            -n argocd \
            --timeout=300s

      - name: Apply ArgoCD KubeSpace
        run: kubectl apply -f argocd/application.yaml

      - name: Verify ArgoCD Applications
        run: kubectl get applications -n argocd
